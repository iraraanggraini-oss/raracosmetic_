<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rara Cosmetics - Premium Beauty & Skincare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       CSS VARIABLE & RESET
       ========================================== */
    :root {
      --primary: #F8BBD0;
      --primary-dark: #F48FB1;
      --secondary: #FCE4EC;
      --accent: #EC407A;
      --accent-hover: #D81B60;
      --bg: #FFF9FB;
      --surface: #FFFFFF;
      --text: #444444;
      --text-muted: #888888;
      --border: #F8BBD040;
      --shadow-sm: 0 4px 12px rgba(236, 64, 122, 0.06);
      --shadow-md: 0 8px 24px rgba(236, 64, 122, 0.12);
      --shadow-lg: 0 12px 32px rgba(236, 64, 122, 0.18);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-bottom: 80px; /* Space for Bottom Nav */
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-dark);
      border-radius: 10px;
    }

    /* ==========================================
       HEADER & NAVIGATION
       ========================================== */
    .sticky-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 90;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo i {
      font-size: 22px;
      color: var(--accent);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--secondary);
      border: none;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: 20%;
      transition: var(--transition);
    }

    .nav-item i {
      font-size: 18px;
      transition: var(--transition);
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item.active i {
      transform: translateY(-2px);
    }

    /* ==========================================
       TOAST NOTIFICATION
       ========================================== */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 1000;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      width: 90%;
      max-width: 380px;
      opacity: 0;
      pointer-events: none;
    }

    .toast-container.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-content {
      background: var(--surface);
      border-left: 5px solid var(--accent);
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toast-icon {
      color: var(--accent);
      font-size: 20px;
    }

    .toast-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    /* ==========================================
       VIEWS & SPA LAYOUT
       ========================================== */
    .view-section {
      display: none;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       ONBOARDING WIZARD OVERLAY
       ========================================== */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(248, 187, 208, 0.95), rgba(252, 228, 236, 0.98));
      backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .onboarding-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .step-progress {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-dot {
      height: 6px;
      flex: 1;
      background: var(--secondary);
      border-radius: 10px;
      transition: var(--transition);
    }

    .step-dot.active {
      background: var(--accent);
    }

    .onboarding-step {
      display: none;
    }

    .onboarding-step.active {
      display: block;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--secondary);
      background: var(--bg);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 4px rgba(236, 64, 122, 0.1);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--primary-dark));
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--accent);
    }

    .btn-outline {
      border: 1.5px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    /* ==========================================
       HOME VIEW COMPONENTS
       ========================================== */
    .hero-banner {
      background: linear-gradient(135deg, #F8BBD0, #FCE4EC);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .hero-text h2 {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .hero-text p {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
    }

    .hero-badge {
      background: white;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      display: inline-block;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Horizontal Scroll Container */
    .horizontal-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-scroll::-webkit-scrollbar {
      display: none;
    }

    .card-horizontal {
      flex: 0 0 160px;
      scroll-snap-align: start;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Product Card */
    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(248, 187, 208, 0.3);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
    }

    .product-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .product-img-wrap {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background: var(--secondary);
      overflow: hidden;
    }

    .product-img-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img-wrap img {
      transform: scale(1.05);
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 34px;
    }

    .product-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .rating {
      color: #FFB300;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: auto;
    }

    .btn-card {
      padding: 8px 4px;
      font-size: 11px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .filter-chip {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ==========================================
       PRODUCT DETAIL VIEW
       ========================================== */
    .detail-container {
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .detail-img-large {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      background: var(--secondary);
    }

    .detail-content {
      padding: 20px;
    }

    .detail-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .detail-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
    }

    .variant-section {
      margin: 18px 0;
    }

    .variant-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .variant-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .variant-btn {
      padding: 8px 14px;
      border: 1.5px solid var(--secondary);
      background: var(--bg);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .variant-btn.selected {
      border-color: var(--accent);
      background: var(--secondary);
      color: var(--accent);
    }

    /* Reviews Section */
    .reviews-section {
      margin-top: 24px;
      border-top: 1px solid var(--secondary);
      padding-top: 18px;
    }

    .review-card {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
    }

    .review-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .review-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      object-fit: cover;
    }

    /* ==========================================
       CART & CHECKOUT VIEWS
       ========================================== */
    .cart-item {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .cart-item-img {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--secondary);
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .cart-item-variant {
      font-size: 11px;
      color: var(--text-muted);
      margin: 2px 0 6px 0;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border-radius: var(--radius-full);
      padding: 4px 8px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      border: none;
      background: white;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .summary-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .summary-row.total {
      font-weight: 800;
      font-size: 15px;
      color: var(--accent);
      border-top: 1px dashed var(--secondary);
      padding-top: 10px;
      margin-bottom: 0;
    }

    /* ==========================================
       PROFILE VIEW
       ========================================== */
    .profile-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      position: relative;
      border: 1px solid var(--border);
    }

    .profile-avatar-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 14px;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      object-fit: cover;
      border: 3px solid var(--primary);
    }

    .badge-member {
      background: linear-gradient(135deg, var(--accent), var(--primary-dark));
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: inline-block;
      margin-top: 6px;
    }

    .profile-stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      padding: 14px 0;
      background: var(--bg);
      border-radius: var(--radius-md);
    }

    .stat-item h4 {
      font-size: 16px;
      color: var(--accent);
      font-weight: 800;
    }

    .stat-item p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ==========================================
       ORDER STATUS VIEW
       ========================================== */
    .order-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid var(--bg);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .order-status-badge {
      color: var(--accent);
      background: var(--secondary);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--secondary);
      z-index: 1;
    }

    .timeline-
